<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Поиск по собственным текстовым документам.">
  <script>
    (() => {
      let dark = false;
      try { dark = localStorage.getItem("jdanoff-search.theme.v1") === "dark"; } catch {}
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.querySelector('meta[name="theme-color"]').content = dark ? "#18181b" : "#f5f5f7";
    })();
  </script>
  <title>jdanoff search</title>
  <link rel="icon" href="/favicon.svg?v=minimal-8" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=minimal-8">
  <script type="module" src="/app.mjs?v=minimal-8"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M18 18A8 8 0 0 1 5 15"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>
  <a class="skip-link" href="#query">К поиску</a>
  <header class="header">
    <a id="brand" class="brand brand-animate" href="/" aria-label="jdanoff search, главная"><span class="brand-initial" aria-hidden="true">j</span><span class="brand-mask" aria-hidden="true"><span class="brand-tail">danoff <span class="brand-search">search</span></span></span></a>
    <div class="header-actions">
      <button class="connection" id="connection" type="button" title="Проверить соединение с сервером"><span class="status-dot"></span><span id="connection-label" class="sr-only" role="status">Подключаемся</span></button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Тёмная тема" aria-pressed="false" title="Включить тёмную тему"><svg class="icon small" aria-hidden="true"><use id="theme-icon" href="#i-moon"/></svg></button>
      <button id="open-upload" class="upload-trigger" type="button" aria-haspopup="dialog"><svg class="icon small" aria-hidden="true"><use href="#i-plus"/></svg><span id="upload-button-label">Добавить файлы</span></button>
    </div>
  </header>
  <main class="workspace">
    <section class="search-workspace" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">Поиск по документам</h1>
      <form id="search-form" class="search-form" novalidate>
        <div class="search-bar">
          <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label class="sr-only" for="query">Поисковый запрос</label>
          <input id="query" name="q" type="search" placeholder="Поиск по документам" autocomplete="off" required enterkeyhint="search">
          <button class="search-submit" id="search-button" type="submit" title="Найти"><span class="sr-only">Найти</span><svg class="icon"><use href="#i-arrow"/></svg></button>
        </div>
      </form>
      <div id="search-error" class="notice error" role="alert" hidden></div>
      <div id="connection-notice" class="notice" role="status" hidden>Нет связи с сервером. Проверь, что он запущен.</div>
      <section class="results-section" aria-labelledby="results-title" aria-busy="false" id="results-section">
        <div class="section-heading">
          <div class="results-heading"><h2 id="results-title">Результаты</h2><span id="results-meta" class="subtle"></span></div>
          <div class="result-tools"><label class="sr-only" for="limit">Количество результатов</label><select id="limit" name="limit" aria-label="Количество результатов"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option></select><button id="density-toggle" type="button" class="density-toggle" aria-pressed="false" aria-label="Компактный вид" title="Компактный вид"><svg class="icon small" aria-hidden="true"><use href="#i-sliders"/></svg></button></div>
        </div>
        <div id="results-status" class="sr-only" role="status" aria-live="polite"></div>
        <div id="results" class="results"><div class="empty-state" id="welcome"><div class="empty-symbol" aria-hidden="true"><svg class="icon"><use href="#i-search"/></svg></div><h3>Результаты появятся здесь</h3><p>Введи запрос или добавь документы.</p></div></div>
      </section>
    </section>
  </main>
  <dialog id="upload-dialog" class="upload-dialog" aria-labelledby="upload-title">
    <div class="dialog-heading"><h2 id="upload-title">Добавить файлы</h2><button id="close-upload" type="button" class="icon-button" aria-label="Закрыть окно загрузки"><svg class="icon small" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div class="drop-zone" id="drop-zone"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><p>Перетащи файлы сюда</p><button class="upload-button" id="choose-files" type="button" autofocus>Выбрать файлы</button><span class="file-limits">.txt · UTF-8 · до 5 МБ</span></div>
    <input id="file-input" class="sr-only" type="file" accept=".txt,text/plain" multiple tabindex="-1" aria-label="Выбрать текстовые документы">
    <div id="upload-feedback" class="upload-feedback" hidden><p id="upload-summary" class="upload-summary" role="status" aria-live="polite"></p><progress id="upload-progress" max="1" value="0" aria-label="Прогресс загрузки"></progress><p id="upload-detail" class="upload-detail"></p><div id="upload-errors" class="upload-errors" role="alert" hidden></div></div>
    <div class="dialog-footer"><button id="finish-upload" type="button" class="done-button">Готово</button></div>
  </dialog>
  <noscript><p class="noscript">Включи JavaScript для загрузки документов и поиска.</p></noscript>
</body>
</html>
