components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 4

        fs-task-processor:
            worker_threads: 2

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                address: 0.0.0.0
                port: 8080

        logging:
            loggers:
                default:
                    file_path: '@stderr'
                    level: info
                    overflow_behavior: discard

        handler-health:
            path: /health
            method: GET
            task_processor: main-task-processor

        search-component:
            data-dir: ./data
            fs-task-processor: fs-task-processor

        handler-search:
            path: /search
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 0

        handler-upload:
            path: /documents
            method: POST
            task_processor: main-task-processor
            # userver limits the entire request, including headers.
            # Allow up to 6 MiB of body plus at most 64 KiB of headers.
            max_request_size: 6356992
            max_headers_size: 65536
            request_body_size_log_limit: 0

        # Run the server from the repository root. Only web/ is public.
        fs-cache-web:
            dir: ./web
            update-period: 1s
            fs-task-processor: fs-task-processor

        handler-static:
            path: /*
            method: GET
            task_processor: main-task-processor
            fs-cache-component: fs-cache-web
            directory-file: index.html
            expires: 0

        dynamic-config:
            defaults:
                USERVER_FILES_CONTENT_TYPE_MAP:
                    .html: "text/html; charset=utf-8"
                    .css: "text/css; charset=utf-8"
                    .mjs: "application/javascript; charset=utf-8"
                    .svg: "image/svg+xml"
